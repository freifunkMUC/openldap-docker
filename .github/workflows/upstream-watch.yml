name: upstream-watch

# Daily: opens an issue for each new OpenLDAP release upstream and for each
# open Debian trixie CVE (see .github/upstream-watch.sh). Does not build or
# publish anything.

on:
  workflow_dispatch:
  schedule:
    # Not at minute 0, and away from the rebuild in docker.yml (04:17).
    - cron: "43 7 * * *"

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Watch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPO,,}:latest"  # registry names are lowercase
          export IMAGE
          .github/upstream-watch.sh
